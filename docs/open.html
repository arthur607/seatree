<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Obsidian</title>
<!-- The "Open in Obsidian" button of Seahorse comes here, because Telegram buttons take only web links.
     The page reads `vault` and `file` from the address and opens obsidian://open with them. Nothing else. -->
<style>
  :root { --bg: #f7f7f8; --text: #1c1c1e; --button: #6d4ae8; --button-text: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --text: #ececf1; --button: #8b6cf6; --button-text: #ffffff; }
  }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 0 16px;
         background: var(--bg); color: var(--text); text-align: center;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 12px; background: var(--button);
      color: var(--button-text); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <p id="line">Opening your note in Obsidian…</p>
  <a id="open" href="obsidian://open">Open in Obsidian</a>
</main>
<script>
  (function () {
    var query = new URLSearchParams(window.location.search);
    var vault = query.get("vault");
    var file = query.get("file");
    if (!vault || !file) {
      document.getElementById("line").textContent = "This link does not name a note.";
      return;
    }
    var target = "obsidian://open?vault=" + encodeURIComponent(vault) + "&file=" + encodeURIComponent(file);
    document.getElementById("open").href = target;
    window.location.href = target;
  })();
</script>
</body>
</html>
