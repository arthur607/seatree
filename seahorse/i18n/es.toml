[chat]
# The bot in a conversation: help, commands, photos and files, voice notes, edits and errors.
help = "Soy Seahorse, tu segundo cerebro 🌊\n• Envíame lo que sea: una idea, una tarea, una película para ver, una foto, un archivo, un lugar o un audio. Lo pongo en el lugar correcto de tus notas.\n• Hazme una pregunta. Respondo con tus notas o con la web.\n• Envía \"semana\" u \"hoy\" para ver tu plan.\n• Para cambiar algo que enviaste, edita tu mensaje o toca ✏️ Corregir en mi respuesta.\n• También escribo primero: un resumen cada mañana, un recordatorio antes de una fecha límite y, a veces, una pregunta o una idea.\n\nComandos:\n/now – una tarea para el tiempo que tienes\n/status – lo que espera y lo que me dejó con dudas\n/integrate – pone ahora en tus notas lo que espera\n/plan – planifica de nuevo esta semana\n/retro – esta semana en una imagen. /retro semana pasada – la semana anterior\n/settings – tu configuración, y cómo cambiarla\n/intro – responde de nuevo las primeras preguntas\n/update – instala la nueva versión de Seahorse\n/help – este mensaje"
