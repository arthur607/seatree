[chat]
# The bot in a conversation: help, commands, photos and files, voice notes, edits and errors.
help = "Eu sou o Seahorse, seu segundo cérebro 🌊\n• Me mande qualquer coisa: uma ideia, uma tarefa, um filme para ver, uma foto, um arquivo, um lugar ou um áudio. Eu coloco no lugar certo das suas notas.\n• Faça uma pergunta. Eu respondo com as suas notas ou com a internet.\n• Mande \"semana\" ou \"hoje\" para ver o seu plano.\n• Para mudar algo que você mandou, edite a mensagem. Ou toque em ✏️ Corrigir na minha resposta.\n• Eu também escrevo primeiro: um resumo toda manhã, um lembrete antes de um prazo e, às vezes, uma pergunta ou uma ideia.\n\nComandos:\n/status – o que espera e o que me deixou em dúvida\n/integrate – coloca agora nas notas o que espera\n/plan – planeja de novo esta semana\n/intro – responde de novo às primeiras perguntas\n/update – instala a nova versão do Seahorse\n/help – esta mensagem"
