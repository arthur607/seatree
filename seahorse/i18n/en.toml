[chat]
# The bot in a conversation: help, commands, photos and files, voice notes, edits and errors.
help = "I am Seahorse, your second brain 🌊\n• Send me anything: a thought, a task, a movie to watch, a photo, a file, a place or a voice note. I put it in the right place in your notes.\n• Ask me a question. I answer from your notes, or from the web.\n• Send \"week\" or \"today\" to see your plan.\n• To change something you sent, edit your message, or tap ✏️ Fix under my reply.\n• I also write first: a summary each morning, a reminder before a deadline, and sometimes a question or an idea.\n\nCommands:\n/now – one task for the time you have\n/status – what waits, and what I was not sure about\n/integrate – put what waits into your notes now\n/plan – plan this week again\n/retro – this week in one image. /retro last week – the week before\n/intro – answer the first questions again\n/update – install the new version of Seahorse\n/help – this message"
